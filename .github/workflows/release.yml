name: Release

# A tag is a release: vX.Y.Z, or vX.Y.Z-label for a pre-release. Re-running the workflow for the same tag must produce
# the same file names and a passing test run, which is why everything below is derived from the tag and the build
# arguments are explicit. "The tag" is `inputs.tag || github.ref_name`: a tag push leaves the input empty and the event
# ref is the tag; a dispatch carries the tag the operator typed, so the jobs check out that tag's commit and name the
# release after it even when the run was started from a branch.
#
# A tag with a label (v0.1.0-rc.1) is marked as a pre-release on GitHub, but it ships Windows artifacts too. The old
# rule (pre-releases are Linux only, because no Windows machine had run the launcher) died with the gate's Windows item
# ([D30](../docs/plan/04-decisions.md)): the installer was built, installed, run and uninstalled on a real Windows VM,
# so every release can carry it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

# One release per tag: re-running the workflow for the same tag replaces nothing and must not overlap with itself.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The first Windows run died mid-restore on a dropped nuget.org connection; retry harder instead of failing a release.
  NUGET_ENABLE_ENHANCED_HTTP_RETRY: true
  NUGET_HTTP_RETRY_COUNT: "5"

jobs:
  linux:
    name: Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore local tools
        run: dotnet tool restore
      - name: appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Publish (runs the tests first)
        run: bash scripts/publish.sh --version "${{ inputs.tag || github.ref_name }}" --only linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Publish
        shell: bash
        run: bash scripts/publish.sh --version "${{ inputs.tag || github.ref_name }}" --only windows --no-tests
      - name: Build the installer
        shell: bash
        run: |
          # The tag carries the 'v' and, for a pre-release, a '-label'. MyAppVersion takes the text form; Inno Setup's
          # VersionInfoVersion only accepts numbers, so strip both and pad to three parts.
          version="${{ inputs.tag || github.ref_name }}"
          version="${version#v}"
          numeric="${version%%-*}"
          case "$numeric" in
            *.*.*) ;;
            *.*) numeric="$numeric.0" ;;
            *) numeric="$numeric.0.0" ;;
          esac
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppVersion=$version" \
            "/DMyVersionInfoVersion=$numeric" \
            "/DMySourceDir=dist\\win-x64-fdd" \
            "/DMyOutputDir=dist" \
            packaging/windows/launcher.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [linux, windows]
    # Both platforms ship now ([D30](../docs/plan/04-decisions.md)), so both have to be green before anything is published.
    if: ${{ always() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum ./* > SHA256SUMS
      - name: Release notes from Conventional Commits
        run: bash scripts/release-notes.sh "${{ inputs.tag || github.ref_name }}" > RELEASE_NOTES.md
      - name: Note the checksums in the body
        run: |
          printf '\n## Checksums\n\n```\n' >> RELEASE_NOTES.md
          cat artifacts/SHA256SUMS >> RELEASE_NOTES.md
          printf '```\n' >> RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.AppImage
            artifacts/*-setup.exe
            artifacts/SHA256SUMS
          fail_on_unmatched_files: false
