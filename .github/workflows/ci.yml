name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore local tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build YuiTushonkaLauncher.slnx -c Release --nologo
      - name: Test
        run: >
          dotnet test YuiTushonkaLauncher.slnx -c Release --no-build --nologo
          --settings coverlet.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger "trx;LogFileName=results.trx"
      - name: Coverage gate (Core and Infrastructure at 90 %)
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet run --project tools/YuiTushonkaLauncher.Tools.CoverageGate -c Release --no-build --
          --report TestResults --min 90
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore
